    <rect x="328" y="222" width="368" height="368" rx="8" fill="url(#art)"/>
    <circle cx="512" cy="406" r="128" fill="url(#sphere)"/>
  </g>
  <rect x="170" y="560" width="684" height="300" rx="70" fill="url(#body)"/>
  <rect x="174" y="564" width="676" height="292" rx="66" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5"/>
  <rect x="250" y="590" width="524" height="34" rx="17" fill="#1E1B16"/>
  <rect x="250" y="700" width="380" height="70" rx="14" fill="#15130F"/>
  <g fill="#7BE07B"><rect x="282" y="725" width="20" height="20" rx="4"/><rect x="314" y="725" width="20" height="20" rx="4"/><rect x="346" y="725" width="20" height="20" rx="4"/></g>
  <circle cx="730" cy="735" r="34" fill="#22351F"/><circle cx="730" cy="735" r="22" fill="#7BE07B"/>
