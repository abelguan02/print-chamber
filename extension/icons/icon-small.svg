    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF5E8"/><stop offset="1" stop-color="#D8CBA9"/></linearGradient>
    <radialGradient id="sphere" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#FFF3F8"/><stop offset=".35" stop-color="#E07AA4"/><stop offset=".8" stop-color="#9E2F5F"/><stop offset="1" stop-color="#5A1E3D"/></radialGradient>
