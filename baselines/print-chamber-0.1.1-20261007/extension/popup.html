<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Print Chamber</title><style>
body{width:280px;margin:0;padding:22px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7f7;color:#253032}h1{font-size:16px;margin:0 0 6px}p{color:#657174;line-height:1.6}label{display:block;margin:16px 0 8px}input[type=password]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd4d4;border-radius:8px;background:white}button{padding:9px 13px;border:0;border-radius:8px;background:#285e57;color:white;margin-top:10px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #378c7f;outline-offset:2px}.toggle{display:flex;align-items:center;gap:8px}a{color:#285e57}#status{min-height:20px}
</style><h1>Print Chamber</h1><p>原画的另一种可能。<br>所有生成都在这台电脑上完成。</p><label for="token">本地连接码</label><input id="token" type="password" placeholder="从本地服务终端复制" autocomplete="off"><button id="save">连接</button><p id="status" role="status" aria-live="polite">正在检查本地服务…</p><label class="toggle"><input id="enabled" type="checkbox" checked>开启悬停预览</label><button id="activate">启用当前页</button><p id="page-status" role="status" aria-live="polite">正在检查当前网页…</p><p>支持 ArtStation、Behance、Pinterest。</p><a href="http://127.0.0.1:8877/demo" target="_blank">打开本地试用画廊 ↗</a><script src="popup.js"></script></html>
