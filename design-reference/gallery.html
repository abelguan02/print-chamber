<style>
body{margin:0;background:#F4F1EC}
a{color:#3B362C}a:hover{color:#7A5A1E}

<div style="min-height: 1200px; background: #F4F1EC; color: #3B362C; font-family: 'PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <div style="max-width: 1320px; margin: 0 auto; padding: 0 24px 72px; box-sizing: border-box">

    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 24px 0">
      <div style="font-family: 'IBM Plex Mono',monospace; font-size: 12px; letter-spacing: 0.22em; color: #5E574A">PRINT CHAMBER · PC-1</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 8px; background: #15130F">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #6BD66B; box-shadow: 0 0 8px 2px rgba(107,214,107,0.6)"></div>
        <div style="font-family: 'Doto','VT323',monospace; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; color: #7BE07B">READY</div>
      </div>
    </header>

    <section style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 40px; padding: 24px 0 48px">
      <div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 20px; max-width: 560px">
        <h1 style="margin: 0; font-size: 52px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">让原画，<br>拥有另一种质感。</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #6E6656">在 ArtStation 上停在任何一张原画上，旁边的小打印机会把它一层层打印成立体的样子。打印过的作品都收在这里。</p>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <div style="padding: 10px 14px; border-radius: 8px; background: #15130F; font-family: 'Doto','VT323',monospace; font-weight: 800; font-size: 16px; letter-spacing: 0.06em; color: #F4B53A">48 PRINTS</div>
          <div style="padding: 10px 14px; border-radius: 8px; background: #15130F; font-family: 'Doto','VT323',monospace; font-weight: 800; font-size: 16px; letter-spacing: 0.06em; color: #F4B53A">AVG 3.6S</div>
        </div>
      </div>
      <div style="flex: 0 0 340px; display: flex; justify-content: center">
        <dc-import name="Printer" state="done" art="gold" hint-size="340px,580px"></dc-import>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; border-top: 1px solid #DCD4C2">
      <h2 style="margin: 0; font-size: 20px; font-weight: 600">出纸托盘</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: none; background: linear-gradient(180deg, #F6C25A, #E09A22); box-shadow: 0 2px 0 #A86F12, inset 0 1px 0 rgba(255,255,255,0.6); color: #3A2508; font-family: inherit; font-size: 13px; cursor: pointer">全部</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: none; background: linear-gradient(180deg, #F6F0E0, #DCD1B5); box-shadow: 0 2px 0 #B0A483, inset 0 1px 0 #FFF; color: #3B362C; font-family: inherit; font-size: 13px; cursor: pointer">ArtStation</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: none; background: linear-gradient(180deg, #F6F0E0, #DCD1B5); box-shadow: 0 2px 0 #B0A483, inset 0 1px 0 #FFF; color: #3B362C; font-family: inherit; font-size: 13px; cursor: pointer">Behance</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: none; background: linear-gradient(180deg, #F6F0E0, #DCD1B5); box-shadow: 0 2px 0 #B0A483, inset 0 1px 0 #FFF; color: #3B362C; font-family: inherit; font-size: 13px; cursor: pointer">Pinterest</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 36px 28px; padding-top: 16px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
        <article style="display: flex; flex-direction: column; gap: 0; transform: rotate({{it.rot}}deg)">
          <div style="padding: 10px 10px 0; background: #FCFAF5; border-radius: 4px 4px 0 0; box-shadow: 0 10px 24px rgba(60,45,20,0.16)">
            <div style="height: 300px; border-radius: 2px; background: {{it.bg}}; position: relative">
              <div style="position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,0.2), transparent 40%)"></div>
            </div>
            <div style="padding: 12px 4px 14px; display: flex; justify-content: space-between; align-items: center">
              <a href="#" style="font-size: 13px; text-decoration: none">@[作者名]</a>
              <span style="font-size: 12px; color: #8A8273">{{it.site}}</span>
            </div>
          </div>
          <div style="padding: 8px 14px; background: #15130F; border-radius: 0 0 4px 4px; display: flex; justify-content: space-between; font-family: 'Doto','VT323',monospace; font-weight: 800; font-size: 12px; letter-spacing: 0.06em; color: #B6AE9B">
            <span>JOB {{it.job}}</span><span>{{it.time}}</span>
          </div>
        </article>
      </sc-for>
    </div>

  </div>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1200}}">

      { bg: g('#FFF1CC', '#E7D29A', '#8F6A2E', '#2B2012'), site: 'ArtStation', job: '#0047', time: '3.2S', rot: 0.8 },
      { bg: g('#FFD2C8', '#F08A7A', '#8E2A2A', '#24100F'), site: 'Behance', job: '#0046', time: '4.1S', rot: -0.5 },
      { bg: g('#E4EAF5', '#B7C2D6', '#4A566E', '#15181F'), site: 'Pinterest', job: '#0045', time: '3.5S', rot: 1.2 },
      { bg: g('#E6FAF0', '#DDF3E8', '#3F7A63', '#0F1F18'), site: 'ArtStation', job: '#0044', time: '3.9S', rot: 0.6 },
      { bg: g('#F3EAFF', '#EADCFF', '#6A45A8', '#1A1030'), site: 'ArtStation', job: '#0043', time: '3.0S', rot: -1.1 },
      { bg: g('#FFF0DC', '#FFE0B8', '#B86A2A', '#2A160A'), site: 'Behance', job: '#0042', time: '3.7S', rot: 0.4 },
      { bg: g('#FFFFFF', '#F5F0E6', '#8A8478', '#1E1D1A'), site: 'ArtStation', job: '#0041', time: '3.3S', rot: -0.7 }

    return { items };

}
</script>
