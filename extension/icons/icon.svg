<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Print Chamber app icon: a 3D print leaving the printer. Palette from design-reference/printer.html. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B362C"/><stop offset="1" stop-color="#15130F"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF5E8"/><stop offset="1" stop-color="#D8CBA9"/></linearGradient>
    <radialGradient id="art" cx=".32" cy=".28" r=".95"><stop offset="0" stop-color="#FCE4EE"/><stop offset=".42" stop-color="#D45A8C"/><stop offset="1" stop-color="#4A1832"/></radialGradient>
    <radialGradient id="sphere" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#FFF3F8"/><stop offset=".35" stop-color="#E07AA4"/><stop offset=".8" stop-color="#9E2F5F"/><stop offset="1" stop-color="#5A1E3D"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#drop)"/>
